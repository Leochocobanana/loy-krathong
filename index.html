<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ลอยกระทงกับ Leo &amp; Myn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: tender, playful, two people far apart making one thing together
   IDEA: a little hand-folded banana-leaf krathong on a moonlit river
   PICTURE: the krathong itself, live, on water — then the whole river at night
   COLOUR and TYPE: indigo night, banana-leaf green, candle gold, lotus pink; Mali
   LAYOUT: one card per step, picture on top, chips below, big friendly buttons */
:root{color-scheme:dark;--bg:#1b1838;--bg2:#2a2552;--ink:#fbf3e6;--mute:#c9c0dd;--pink:#f4a3b8;--gold:#ffcf6e;--leaf:#8cc56f;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 70% 0%,#3b2f6b 0%,var(--bg) 55%,#120f28 100%) fixed;color:var(--ink);font:16px/1.55 Mali,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.scr{display:none;min-height:100%;padding:clamp(16px,3vw,32px) max(4vw,14px) 40px}
.scr.on{display:block}
h1,h2{font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px)}
h2{font-size:clamp(24px,4vw,32px)}
.mute{color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 26px;border-radius:999px;background:linear-gradient(180deg,#ffd98a,#f5b64a);color:#3a2408;font-weight:700;font-size:18px;box-shadow:0 6px 0 #b9802a,0 10px 24px rgba(0,0,0,.3);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #b9802a}
.btn[disabled]{filter:grayscale(.7) brightness(.8);cursor:default}
.btn.pink{background:linear-gradient(180deg,#ffc3d1,#f08aa6);color:#4a1424;box-shadow:0 6px 0 #b85873,0 10px 24px rgba(0,0,0,.3)}
.link{text-decoration:underline;color:var(--gold);padding:8px;min-height:44px}
/* intro */
.intro{text-align:center;padding-top:clamp(20px,6vh,70px)}
.intro .moon{width:110px;height:110px;margin:0 auto 18px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fff8df,#ffe6a8 60%,#f3c870);box-shadow:0 0 60px 20px rgba(255,220,140,.25)}
.who{display:grid;grid-template-columns:repeat(2,minmax(0,220px));justify-content:center;gap:clamp(14px,3vw,28px);margin:28px auto 16px}
.who button{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:16px 10px 18px;transition:transform .15s,border-color .15s}
.who button:hover:not([disabled]){transform:translateY(-4px);border-color:var(--gold)}
.who button[disabled]{opacity:.45;cursor:default}
.who svg{width:100%;max-width:150px;height:auto;display:block;margin:0 auto}
.who b{display:block;font-size:26px;margin-top:6px}
.who small{display:block;color:var(--mute);font-size:14px;min-height:22px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);background:var(--card);padding:6px 14px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;background:#777;flex:none}
.dot.on{background:#7be08f;box-shadow:0 0 8px #7be08f}
/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pair{display:flex;align-items:center;gap:6px;background:var(--card);padding:5px 12px 5px 5px;border-radius:999px;font-size:14px}
.av{width:36px;height:36px;border-radius:50%;background:#3a3466;overflow:hidden;position:relative;flex:none}
.av svg{width:100%;height:100%}
.av .dot{position:absolute;right:1px;bottom:1px;border:2px solid var(--bg)}
.heart{width:18px;height:18px;fill:var(--pink)}
/* decorate */
.deco{display:grid;gap:18px}
@media(min-width:820px){.deco{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}.stage{position:sticky;top:16px}}
.stage{border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#2b2660 0%,#2c3f6d 55%,#1f3b5c 56%,#152842 100%);position:relative;aspect-ratio:300/270}
.stage svg{position:absolute;inset:0;width:100%;height:100%}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.tabs button{flex:none;min-height:44px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.06);font-weight:600}
.tabs button.on{background:var(--leaf);color:#1d3312}
.row{margin:10px 0 14px}
.row>p{margin:0 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:16px;background:rgba(255,255,255,.08);border:2px solid transparent;font-size:15px}
.chip.on{border-color:var(--gold);background:rgba(255,207,110,.18)}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.2)}
.sw.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,207,110,.3)}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:16px}
.wait{font-size:14px;color:var(--mute)}
/* modal */
.modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(10,8,25,.6);backdrop-filter:blur(4px);padding:16px;z-index:5}
.modal.on{display:grid}
.dlg{width:min(460px,100%);background:linear-gradient(180deg,#fff6e6,#ffe9cf);color:#3b2a2a;border-radius:28px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.dlg h2{color:#7a3550;font-size:26px;margin-bottom:6px}
.dlg textarea{width:100%;min-height:120px;border-radius:18px;border:2px solid #f0c7a8;background:#fff;padding:12px 14px;font:16px/1.5 Mali,sans-serif;color:#3b2a2a;resize:vertical}
.dlg .wait{color:#8a6a6a}
/* light */
.lightwrap{max-width:560px;margin:0 auto;text-align:center}
.lightwrap .stage{cursor:pointer;margin:16px 0}
.hint{position:absolute;left:50%;top:8%;transform:translateX(-50%);background:rgba(0,0,0,.45);padding:6px 14px;border-radius:999px;font-size:14px;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
/* flames */
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .18s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.92,1.08) skewX(3deg)}}
.ignite{animation:ign .7s ease-out}
@keyframes ign{from{transform:scale(0);opacity:0}}
.ignite{transform-box:fill-box;transform-origin:50% 100%}
.smoke{animation:smk 3s linear infinite;opacity:0}
@keyframes smk{0%{opacity:0;transform:translateY(0)}20%{opacity:.5}100%{opacity:0;transform:translateY(-30px)}}
.glow{animation:gl 1.4s ease-in-out infinite alternate}
@keyframes gl{to{opacity:.6}}
/* river */
#s-river{padding:0;position:fixed;inset:0}
#river,#fw{position:absolute;inset:0;width:100%;height:100%}
.ripple{animation:rp 3s ease-in-out infinite alternate}
@keyframes rp{to{opacity:.25;transform:translateX(8px)}}
.tw{animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.2}}
.end{position:absolute;left:50%;bottom:max(16px,3vh);transform:translateX(-50%);width:min(560px,calc(100% - 24px));background:rgba(27,24,56,.82);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:28px;padding:20px;text-align:center;opacity:0;pointer-events:none;transition:opacity 1.2s}
.end.on{opacity:1;pointer-events:auto}
.wishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0;text-align:start}
.wish{background:rgba(255,255,255,.07);border-radius:18px;padding:12px 14px}
.wish b{display:flex;align-items:center;gap:8px;color:var(--gold)}
.wish p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.snd{position:fixed;top:12px;right:12px;z-index:9;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);display:grid;place-items:center;backdrop-filter:blur(4px)}
.snd svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fairbox{position:relative;height:clamp(320px,60vh,540px);border-radius:24px;overflow:hidden;background:#151233;touch-action:none;cursor:pointer}
#fair{position:absolute;inset:0;width:100%;height:100%}
.fctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.arw{width:60px;height:60px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;flex:none;user-select:none;-webkit-user-select:none;touch-action:none}
.arw:active{background:rgba(255,207,110,.25)}
.arw svg{width:28px;height:28px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fmid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;flex:1}
.fmid .btn{font-size:16px;padding:0 18px}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(255,243,230,.95);color:#5a3a2a;padding:6px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.fhint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--mute);background:rgba(0,0,0,.4);padding:4px 10px;border-radius:999px;pointer-events:none}
.lg{transform-box:fill-box;transform-origin:50% 0}
.walk .lg.a{animation:la .34s ease-in-out infinite alternate}.walk .lg.b{animation:lb .34s ease-in-out infinite alternate}
@keyframes la{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}@keyframes lb{from{transform:rotate(22deg)}to{transform:rotate(-22deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sw 2.4s ease-in-out infinite alternate}@keyframes sw{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spn 1.2s linear infinite}@keyframes spn{to{transform:rotate(360deg)}}
.bulb{animation:tw 1.6s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.flame,.ripple,.tw,.smoke,.hint,.glow{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<radialGradient id="glowG"><stop offset="0" stop-color="#ffe29a" stop-opacity=".9"/><stop offset=".4" stop-color="#ffb84d" stop-opacity=".35"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/></radialGradient>
<radialGradient id="moonG"><stop offset="0" stop-color="#fff9e3"/><stop offset=".7" stop-color="#ffe6a8"/><stop offset="1" stop-color="#f2c56c"/></radialGradient>
<radialGradient id="haloG"><stop offset="0" stop-color="#ffe7b0" stop-opacity=".45"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/></radialGradient>
<linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151236"/><stop offset=".6" stop-color="#3a2d68"/><stop offset="1" stop-color="#6a4a7e"/></linearGradient>
<linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3c6e"/><stop offset="1" stop-color="#0f1a33"/></linearGradient>
<symbol id="hrt" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></symbol>
</defs></svg>

<button class="snd" id="snd" aria-label="เปิดหรือปิดเสียง"></button>
<section class="scr on" id="s-intro"><div class="wrap intro">
  <div class="moon"></div>
  <h1>My name is…</h1>
  <p class="mute">คืนนี้มาแต่งกระทงแล้วลอยไปด้วยกันนะ</p>
  <div class="who">
    <button id="pick-leo" data-role="leo"><span id="cv-leo"></span><b>Leo</b><small id="tk-leo"></small></button>
    <button id="pick-myn" data-role="myn"><span id="cv-myn"></span><b>Myn</b><small id="tk-myn"></small></button>
  </div>
  <span class="status"><span class="dot" id="cdot"></span><span id="ctext">กำลังเชื่อมต่อ…</span></span>
</div></section>

<section class="scr" id="s-fair"><div class="wrap">
  <div class="bar"><h2>เดินงานลอยกระทง</h2><div class="pair" id="pair0"></div></div>
  <div class="fairbox" id="fairbox"><svg id="fair" viewBox="0 0 800 420" preserveAspectRatio="none"></svg><div class="toast" id="toast"></div><div class="fhint" id="fhint">แตะที่พื้นเพื่อเดิน หรือกดลูกศร</div></div>
  <div class="fctl">
    <button class="arw" id="goL" aria-label="เดินไปทางซ้าย"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="fmid"><button class="btn" id="fAct" disabled>เดินไปที่ร้านได้เลย</button><button class="btn pink" id="fHeart" hidden>ส่งหัวใจ</button></div>
    <button class="arw" id="goR" aria-label="เดินไปทางขวา"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="wait" id="wf" style="text-align:center;margin-top:10px"></div>
</div></section>

<section class="scr" id="s-decor"><div class="wrap">
  <div class="bar"><h2>แต่งกระทงด้วยกัน</h2><div class="pair" id="pair1"></div></div>
  <div class="deco">
    <div class="stage"><svg viewBox="0 0 300 270" id="prev"></svg></div>
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div id="ctl"></div>
      <div class="act"><button class="btn" id="okDecor">โอเคแล้ว มาเขียนคำอวยพรกัน</button><button class="link" id="rnd">สุ่มให้หน่อย</button></div>
      <div class="wait" id="w0"></div>
    </div>
  </div>
</div>
<div class="modal" id="wishM"><div class="dlg">
  <h2>เขียนคำอวยพร</h2>
  <p style="margin:0 0 10px" id="wishFor">ใส่ลงไปในกระทงของเรา</p>
  <textarea id="wishTx" maxlength="200" placeholder="ขอให้เรา…"></textarea>
  <div class="act"><button class="btn pink" id="okWish">ใส่ลงกระทง</button></div>
  <div class="wait" id="w1"></div>
</div></div>
</section>

<section class="scr" id="s-light"><div class="wrap lightwrap">
  <div class="bar" style="justify-content:center"><div class="pair" id="pair2"></div></div>
  <h2>จุดธูปเทียนกัน</h2>
  <div class="stage" id="lightStage"><svg viewBox="0 0 300 270" id="lprev"></svg><span class="hint" id="hint">แตะที่กระทงเพื่อจุดไฟ</span></div>
  <div class="act" style="justify-content:center"><button class="btn" id="okFloat" disabled>ไปลอยกัน</button></div>
  <div class="wait" id="w2"></div>
</div></section>

<section class="scr" id="s-river">
  <svg id="river" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid slice"></svg>
  <canvas id="fw"></canvas>
  <div class="end" id="end">
    <h2>สุขสันต์วันลอยกระทง</h2>
    <div class="wishes" id="wishes"></div>
    <button class="btn pink" id="again">ลอยกันอีกรอบ</button>
  </div>
</section>

<script>
{
const $=s=>document.querySelector(s);
const PC=[['ใบตอง','#6aa556','#3f7a36'],['ใบตองอ่อน','#a6cc72','#729c48'],['ชมพู','#f4adc0','#d47b95'],['ม่วง','#bfa9e8','#8a72c4'],['ขาว','#f5f0e4','#c9bfa6']];
const PS=['กลีบพนมมือ','กลีบกุหลาบ','กลีบเล็บมือนาง'];
const PP=['M-9 0Q-10-16 0-32Q10-16 9 0Z','M-10 0C-15-17-7-27 0-27C7-27 15-17 10 0Z','M-7 0L-4-34L0-24L4-34L7 0Z'];
const FL=['บัว','ดาวเรือง','กุหลาบ','มะลิ','กล้วยไม้','บานไม่รู้โรย'];
const CC=[['ทอง','#f2c14e'],['ขาว','#f6f1e6'],['ชมพู','#f5a3b5']];
const IN=[1,3,5];
const NAME={leo:'Leo',myn:'Myn'};
const ci=(v,n,d)=>{v=Math.floor(+v);return v>=0&&v<n?v:d};
function san(d){d=d||{};return{tiers:ci(d.tiers-1,4,1)+1,petal:[0,1,2,3].map(i=>ci(d.petal&&d.petal[i],3,0)),pcol:[0,1,2,3].map(i=>ci(d.pcol&&d.pcol[i],5,0)),center:ci(d.center,FL.length,0),ring:[...new Set((Array.isArray(d.ring)?d.ring:[]).map(v=>ci(v,FL.length,-1)).filter(v=>v>=0))].slice(0,6),every:!!d.every,candle:ci(d.candle,3,0),incense:ci(d.incense,3,1)}}
const DEF={tiers:2,petal:[0,1,0,2],pcol:[0,2,1,0],center:0,ring:[3,1],every:false,candle:0,incense:1};

/* ---------- drawing ---------- */
function flower(k,x,y,s){
  let g='';
  if(k===0){[-56,-28,0,28,56].forEach(a=>g+=`<path d="M0 0C-7-6-6-17 0-22C6-17 7-6 0 0Z" fill="#f7a9c1" stroke="#df7d9c" stroke-width=".8" transform="rotate(${a})"/>`);g+='<path d="M0 0C-4-4-3-11 0-14C3-11 4-4 0 0Z" fill="#fde0e8"/>'}
  else if(k===1){for(let i=0;i<10;i++){const a=i*.6283;g+=`<circle cx="${(Math.cos(a)*7).toFixed(1)}" cy="${(Math.sin(a)*7).toFixed(1)}" r="4.6" fill="#f7a823"/>`}g+='<circle r="6.5" fill="#f58b12"/><circle r="2.6" fill="#d66a08"/>'}
  else if(k===2){g='<circle r="8.5" fill="#e04b5a"/><path d="M-5 1a5 5 0 0 1 9-3M-2 4a4 4 0 0 0 6-5M-1-2a2 2 0 1 1 3 2" fill="none" stroke="#a92a3a" stroke-width="1.3"/>'}
  else if(k===3){for(let i=0;i<5;i++){const a=i*1.2566-1.57;g+=`<circle cx="${(Math.cos(a)*4.2).toFixed(1)}" cy="${(Math.sin(a)*4.2).toFixed(1)}" r="3.8" fill="#fffdf6" stroke="#e7e0cc" stroke-width=".6"/>`}g+='<circle r="2" fill="#f3d36b"/>'}
  else if(k===4){for(let i=0;i<5;i++)g+=`<ellipse cy="-5" rx="3.4" ry="6" fill="#b57ad6" stroke="#8d55b3" stroke-width=".6" transform="rotate(${i*72})"/>`;g+='<circle r="2.4" fill="#f6e08a"/>'}
  else{g='<circle r="5.5" fill="#c2397a"/><circle cx="-2" cy="-2" r="1.2" fill="#e77aab"/><circle cx="2" cy="1" r="1.2" fill="#e77aab"/><circle cx="-1" cy="2.5" r="1" fill="#e77aab"/>'}
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s})">${g}</g>`;
}
function kr(d,lit,fresh){
  let o='<ellipse cx="150" cy="230" rx="128" ry="26" fill="#0b1630" opacity=".35"/>';
  if(lit)o+='<ellipse cx="150" cy="232" rx="90" ry="14" fill="url(#glowG)" opacity=".7"/>';
  o+='<ellipse cx="150" cy="222" rx="120" ry="31" fill="#b5a46b"/><ellipse cx="150" cy="214" rx="120" ry="31" fill="#eadfb4" stroke="#cbb77f" stroke-width="2"/><ellipse cx="150" cy="214" rx="96" ry="24" fill="none" stroke="#d9c88f" stroke-width="1.5"/>';
  for(let i=0;i<d.tiers;i++){
    const r=104-i*20,y=204-i*24,ry=r*.27,n=16-i*2,s=1-i*.1,c=PC[d.pcol[i]],p=PP[d.petal[i]];
    const pts=[];for(let j=0;j<n;j++){const a=j/n*Math.PI*2+(i%2?Math.PI/n:0);pts.push([a,Math.sin(a)])}
    const pet=q=>{const a=q[0],x=150+Math.cos(a)*r,yy=y+Math.sin(a)*ry;return `<path d="${p}" fill="${c[1]}" stroke="${c[2]}" stroke-width="1.2" transform="translate(${x.toFixed(1)} ${yy.toFixed(1)}) rotate(${(Math.cos(a)*22).toFixed(1)}) scale(${s})"/>`};
    o+=pts.filter(q=>q[1]<0).sort((a,b)=>a[1]-b[1]).map(pet).join('');
    o+=`<ellipse cx="150" cy="${y}" rx="${r}" ry="${ry.toFixed(1)}" fill="${c[2]}"/><ellipse cx="150" cy="${y-2}" rx="${r-6}" ry="${(ry-3).toFixed(1)}" fill="${c[1]}" opacity=".55"/>`;
    o+=pts.filter(q=>q[1]>=0).sort((a,b)=>a[1]-b[1]).map(pet).join('');

  $('#river').innerHTML=`<rect width="800" height="300" fill="url(#skyG)"/>${stars}<circle cx="${VX}" cy="105" r="120" fill="url(#haloG)"/><circle cx="${VX}" cy="105" r="46" fill="url(#moonG)"/><path d="M0 290L0 270Q60 250 120 262T250 258T400 266T560 254T700 262T800 258V290Z" fill="#1a1838"/>${lights}<rect y="288" width="800" height="232" fill="url(#waterG)"/><ellipse cx="${VX}" cy="300" rx="60" ry="6" fill="#ffe6a8" opacity=".35"/>${rip}<g id="og">${og}</g><path d="M0 520V470Q120 440 230 446T360 462Q400 490 395 520Z" fill="#14122b"/><g transform="translate(276 432) scale(.56)">${ch('leo')}</g><g transform="translate(332 436) scale(.54)">${ch('myn')}</g><use href="#hrt" x="324" y="418" width="16" height="16" fill="#f4a3b8"/>`;
  const grp=$('#og'),ourO={el:$('#our'),z:.95};others.forEach((o,i)=>o.el=$('#o'+i));
  const cv=$('#fw'),cx=cv.getContext('2d');

  const t0=performance.now();let last=t0,nextB=8,nextSort=0;
  const step=now=>{
    const t=(now-t0)/1000,dt=Math.min(.05,(now-last)/1000);last=now;
    const p=Math.min(t/30,1),e=1-Math.pow(1-p,2);ourO.z=.95-.89*e;

    others.forEach(o=>{
      o.z-=o.v*dt*(.35+o.z);
      if(o.z<.02){o.z=1.1+Math.random()*.3;o.u=(Math.random()<.5?-1:1)*(.18+Math.random()*.85)}
      const [a,b,c]=place(o.z,o.u);
      o.el.setAttribute('transform',`translate(${a.toFixed(1)} ${(b+Math.sin(t*1.3+o.ph)*6*c).toFixed(1)}) scale(${c.toFixed(3)}) translate(-150 -222)`);
      o.el.style.opacity=Math.min(1,o.z/.07).toFixed(2);
    });
    if(t>nextSort){nextSort=t+.4;[...others,ourO].sort((a,b)=>a.z-b.z).forEach(o=>grp.appendChild(o.el))}
    if(t>nextB){nextB=t+(t<20?.6+Math.random()*.7:1.6+Math.random());launch(cv)}
    rockets=rockets.filter(r=>{r.y+=r.vy*dt;fwP.push({x:r.x+(Math.random()-.5)*2,y:r.y,vx:0,vy:20,c:'#ffe2a8',r:1.3*devicePixelRatio,l:.35,L:.35});if(r.y<=r.ty){explode(cv,r);return false}return true});
    cx.clearRect(0,0,cv.width,cv.height);cx.globalCompositeOperation='lighter';
    fwP=fwP.filter(q=>(q.l-=dt)>0);

  raf=requestAnimationFrame(step);
}
function launch(cv){
  const W=cv.width,H=cv.height,x=W*(.15+Math.random()*.7),ty=H*(.1+Math.random()*.28),y0=H*.55;

function explode(cv,r){

  for(let i=0;i<n;i++){const a=i/n*Math.PI*2;let vx=Math.cos(a)*sp,vy=Math.sin(a)*sp;

  $('#end').classList.add('on');
}
}
